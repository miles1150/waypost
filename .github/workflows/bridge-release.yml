name: Build bridge artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-release.yml"
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge-release.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path bridge/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path bridge/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path bridge/Cargo.toml
  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --manifest-path bridge/Cargo.toml --target "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked --manifest-path bridge/Cargo.toml --target "${{ matrix.target }}"
      - name: Package and checksum
        shell: bash
        run: |
          mkdir dist
          cp "bridge/target/${{ matrix.target }}/release/waypost-bridge" dist/
          cp bridge/README.md LICENSE dist/
          git rev-parse HEAD > dist/COMMIT
          uname -sm > dist/BUILD_PLATFORM
          cp -R bridge/examples dist/
          tar -czf "waypost-bridge-${{ matrix.target }}.tar.gz" -C dist .
          shasum -a 256 "waypost-bridge-${{ matrix.target }}.tar.gz" > "waypost-bridge-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: waypost-bridge-${{ matrix.target }}
          path: |
            waypost-bridge-${{ matrix.target }}.tar.gz
            waypost-bridge-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
